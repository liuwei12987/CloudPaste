name: Deploy SPA CF Workers[一体化部署]

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - "backend/**"
      - "!frontend/vercel.json"
  workflow_dispatch:
    inputs:
      from_panel:
        description: "是否由部署控制面板触发 / triggered from deployment control panel"
        required: false
        default: "false"
  repository_dispatch:
    types: [deploy-spa-button]

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔍 检查部署配置
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手动触发（repository_dispatch），忽略开关，允许部署"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.from_panel }}" != "true" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ 手动触发（workflow_dispatch），忽略开关，允许部署"
            exit 0
          fi

          SPA_ENABLED="${{ vars.SPA_DEPLOY }}"
          [ -z "$SPA_ENABLED" ] && SPA_ENABLED="false"

          if [ "$SPA_ENABLED" = "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ SPA 自动部署已开启，允许部署"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "⏸️ SPA 自动部署已关闭，跳过部署"
          fi

  deploy-spa:
    needs: check-config
    if: needs.check-config.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check if deploy button trigger
        id: check-deploy-button
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" && "${{ github.event.action }}" == "deploy-spa-button" ]]; then
            echo "is_deploy_button=true" >> $GITHUB_OUTPUT
          else
            echo "is_deploy_button=false" >> $GITHUB_OUTPUT
          fi

      # ==================== 步骤 1：构建前端 ====================
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          echo "安装前端依赖..."
          npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: |
          echo "构建前端静态资源..."
          npm run build
        env:
          VITE_APP_ENV: production
          VITE_ENABLE_DEVTOOLS: false

      - name: Verify frontend build
        run: |
          echo "✅ 验证前端构建产物..."
          if [ ! -d "frontend/dist" ]; then
            echo "❌ 前端构建失败：dist 目录不存在"
            exit 1
          fi
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "❌ 前端构建失败：index.html 不存在"
            exit 1
          fi
          echo "前端构建产物大小："
          du -sh frontend/dist
          echo "前端文件数量："
          find frontend/dist -type f | wc -l

      # ==================== 步骤 2：准备后端部署 ====================
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          echo "安装后端依赖（不包含可选依赖）..."
          if npm ci --no-optional; then
            echo "✅ npm ci 成功"
          else
            echo "⚠️ npm ci 失败，将使用npm install更新lock文件"
            npm install --no-optional
          fi

      - name: Disable wrangler telemetry
        working-directory: ./backend
        run: npx wrangler telemetry disable

      # ==================== 步骤 3：D1 数据库（已预配置，跳过创建） ====================
      - name: Verify D1 Database ID in wrangler.spa.toml
        working-directory: ./backend
        run: |
          echo "检查 wrangler.spa.toml 中的 database_id..."
          DATABASE_ID=$(grep -oP 'database_id = "\K[^"]+' wrangler.spa.toml || echo "")
          if [ -z "$DATABASE_ID" ]; then
            echo "❌ wrangler.spa.toml 中未找到 database_id"
            exit 1
          fi
          # Check if it's still a placeholder
          if [[ "$DATABASE_ID" == *"x"* || ${#DATABASE_ID} -lt 30 ]]; then
            echo "❌ database_id appears to be a placeholder: $DATABASE_ID"
            exit 1
          fi
          echo "✅ database_id 已预设: $DATABASE_ID"
          echo "database_id=$DATABASE_ID" >> $GITHUB_ENV

      - name: Initialize D1 Database schema (remote)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "初始化远程数据库表结构..."
          npx wrangler d1 execute cloudpaste-db --remote --file=./schema.sql || echo "⚠️ 表可能已存在，继续部署"

      # ==================== 步骤 4：环境变量 ====================
      - name: Resolve ENCRYPTION_SECRET for deploy
        working-directory: ./backend
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔐 检查 ENCRYPTION_SECRET 配置..."
          set +e
          SECRET_LIST_OUTPUT=$(npx wrangler secret list --name cloudpaste-spa 2>&1)
          set -e
          if echo "$SECRET_LIST_OUTPUT" | grep -q "ENCRYPTION_SECRET"; then
            echo "✅ Worker 已存在 ENCRYPTION_SECRET（Secret），保持不变"
            exit 0
          fi
          if [[ -n "${{ secrets.ENCRYPTION_SECRET }}" ]]; then
            echo "✅ 使用 GitHub Secrets 中的 ENCRYPTION_SECRET"
            ENCRYPTION_VALUE="${{ secrets.ENCRYPTION_SECRET }}"
            ENCRYPTION_ESCAPED=$(printf '%s' "$ENCRYPTION_VALUE" | sed -e 's/[\\/&]/\\&/g')
            if grep -q "^ENCRYPTION_SECRET =" wrangler.spa.toml; then
              sed -i -E "s/^ENCRYPTION_SECRET = \".*\"$/ENCRYPTION_SECRET = \"${ENCRYPTION_ESCAPED}\"/" wrangler.spa.toml
            else
              sed -i -E "/^\[vars\]$/a\\ENCRYPTION_SECRET = \"${ENCRYPTION_ESCAPED}\"" wrangler.spa.toml
            fi
            exit 0
          fi
          if grep -q "^ENCRYPTION_SECRET =" wrangler.spa.toml; then
            echo "✅ 使用 wrangler.spa.toml 中的 ENCRYPTION_SECRET"
          else
            echo "❌ 缺少 ENCRYPTION_SECRET"
            exit 1
          fi

      # ==================== 步骤 5：部署 SPA Worker ====================
      - name: Deploy to Cloudflare Workers (SPA Mode)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🚀 使用 SPA 配置部署到 Cloudflare Workers..."
          npx wrangler deploy --config wrangler.spa.toml

      # ==================== 步骤 6：部署后验证 ====================
      - name: Display Success Information
        if: steps.check-deploy-button.outputs.is_deploy_button == 'true' && success()
        run: |
          echo "===================================================="
          echo "🎉 CloudPaste SPA 已成功部署到 Cloudflare Workers!"
          echo "===================================================="
          echo ""
          echo "✅ 部署模式：Workers + Static Assets 一体化"
          echo "✅ Worker 名称：cloudpaste-spa"
          echo "✅ 前端和后端已部署到同一个 Worker"
          echo ""
          echo "后续步骤："
          echo "1. 访问您的 Worker URL"
          echo "2. 使用默认管理员账户登录 (admin/admin123)"
          echo "3. ⚠️  立即修改默认管理员密码"
          echo "4. 在管理员面板中配置您的 S3 兼容存储"
          echo "5. （可选）在 Cloudflare Dashboard 中绑定自定义域名"
          echo "===================================================="

      - name: Display Troubleshooting Info
        if: failure()
        run: |
          echo "===================================================="
          echo "❌ 部署失败，可能的解决方案:"
          echo ""
          echo "1. 前端构建问题：检查 frontend/package.json 依赖"
          echo "2. 后端部署问题：确保 wrangler.spa.toml 配置正确"
          echo "3. 检查 CLOUDFLARE_API_KEY/CLOUDFLARE_EMAIL 权限"
          echo "4. 验证 D1 database_id 是否正确"
          echo "===================================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ SPA Worker部署成功！"
          else
            echo "❌ SPA Worker部署失败！"
          fi
